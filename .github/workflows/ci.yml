name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Instalar o Claude Code (versão fixa)
        run: npm install -g @anthropic-ai/claude-code@2.1.114

      - name: Validar marketplace e plugins
        run: |
          claude plugin validate .
          claude plugin validate plugins/checkup
          claude plugin validate plugins/spec
          claude plugin validate plugins/polish

      - name: Validações estruturais (catálogos, referências, skills, estilo, links, arquivos proibidos)
        run: python3 -X utf8 scripts/validate.py

      - name: Suítes de eval em dia com o gerador
        run: python3 -X utf8 scripts/generate_evals.py --check

      - name: Procurar segredos no histórico (gitleaks, versão e checksum fixos)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          ./gitleaks git --redact --no-banner .
